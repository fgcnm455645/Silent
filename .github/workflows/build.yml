name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: |
          mkdir -p proj
          for z in *.zip; do unzip -o "$z" -d proj; done
          S=$(find proj -name settings.gradle | head -1)
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: proj/**/app/build/outputs/apk/debug/*.apk
